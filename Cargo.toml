[workspace]
resolver = "2"
members = ["crates/midas", "crates/midas-cli", "crates/midas-macros"]
exclude = ["crates/midas/tests/fixtures/embedded"]

[workspace.package]
version = "0.7.6"
authors = ["Edward Fitz Abucay <gh:@ffimnsr>"]
edition = "2021"
rust-version = "1.99"
homepage = "https://github.com/ffimnsr/midas"
repository = "https://github.com/ffimnsr/midas"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities", "development-tools"]
keywords = ["sql", "database", "command-line", "migrate", "cli"]

[workspace.dependencies]
anyhow = "1.0.93"
assert_cmd = "2.1.1"
assert_fs = "1.1.2"
clap = { version = "4.5", features = ["env", "string"] }
clap_complete = "4.5.41"
console = "0.16"
crc = "3.2"
dotenvy = "0.15"
indicatif = "0.18"
indoc = "2"
mk_ext_prettytable = { version = "0.11.0", default-features = false, features = ["win_crlf"] }
midas = { version = "0.7.6", path = "crates/midas", default-features = false }
midas-macros = { version = "0.7.6", path = "crates/midas-macros" }
native-tls = "0.2"
postgres = "0.19"
postgres-native-tls = "0.5.3"
postgres-rustls = { package = "postgres_rustls", version = "0.1" }
predicates = { version = "3.1.3", default-features = false, features = ["diff", "regex"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
snapbox = "0.6.21"
tempfile = "3.15"
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", default-features = false, features = ["postgres"] }
thiserror = "1.0.69"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
trycmd = "0.15.8"
url = "2.5"
