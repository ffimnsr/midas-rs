[package]
name = "midas"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
description = "Do painless migration 🦀"
readme = "../../README.md"

[lib]
name = "midas"

[features]
default = ["postgres", "sqlite"]
postgres = ["dep:postgres"]
sqlite = ["dep:rusqlite"]
macros = ["dep:midas-macros"]
tls-native-tls = ["dep:postgres-native-tls", "dep:native-tls"]
tls-rustls = ["dep:postgres-rustls"]
openssl-vendored = ["tls-native-tls", "native-tls/vendored"]

[dependencies]
console.workspace = true
crc.workspace = true
indicatif.workspace = true
indoc.workspace = true
midas-macros = { workspace = true, optional = true }
mk_ext_prettytable.workspace = true
native-tls = { workspace = true, optional = true }
postgres = { workspace = true, optional = true }
postgres-native-tls = { workspace = true, optional = true }
postgres-rustls = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
testcontainers.workspace = true
testcontainers-modules.workspace = true
